# ---------------------------------------------------------------------------
# Platform presets. Edit limits here WITHOUT touching code — platform limits
# change often, so nothing below is hardcoded in Python.
#
# length_min_s / length_max_s   : allowed clip duration window (seconds)
# length_default_min/max_s      : default suggested window (user-adjustable)
# aspect                        : "9:16" (vertical) or "16:9" (horizontal)
# width / height                : render resolution
# reframe                       : true when source 16:9 must be cropped to 9:16
# captions_recommended          : UI hint
# ---------------------------------------------------------------------------
presets:
  youtube_shorts:
    label: "YouTube Shorts"
    aspect: "9:16"
    width: 1080
    height: 1920
    length_min_s: 5
    length_max_s: 60
    length_default_min_s: 30
    length_default_max_s: 60
    reframe: true
    captions_recommended: true

  youtube_clip:
    label: "YouTube long-form clip"
    aspect: "16:9"
    width: 1920
    height: 1080
    length_min_s: 60
    length_max_s: 600
    length_default_min_s: 120
    length_default_max_s: 600
    reframe: false
    captions_recommended: false

  facebook_reel:
    label: "Facebook Reel"
    aspect: "9:16"
    width: 1080
    height: 1920
    length_min_s: 5
    length_max_s: 90
    length_default_min_s: 30
    length_default_max_s: 90
    reframe: true
    captions_recommended: true

  facebook_video:
    label: "Facebook video clip"
    aspect: "16:9"
    width: 1920
    height: 1080
    length_min_s: 60
    length_max_s: 900
    length_default_min_s: 60
    length_default_max_s: 900
    reframe: false
    captions_recommended: false
